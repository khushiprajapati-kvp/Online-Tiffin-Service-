<!DOCTYPE html>
<html>
<head>
<title>Contact Messages - Admin</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

.container{
    width:80%;
    margin:40px auto;
    background:#ffffff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}


/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#ff6b00; /* orange */
    color:white;
    padding:10px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #eee;
    color:#333;
}

/* DELETE BUTTON */
.delete-btn{
    padding:6px 12px;
    background:#dc3545; /* red */
    color:white;
    border-radius:5px;
    font-size:14px;
    margin-left:5px;
    transition:0.3s;
    text-decoration: none;
    border: none;
    outline: none;
    cursor: pointer;
}

.delete-btn:hover{
    background:#c82333;
}

/* BACK BUTTON */
.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 15px;
    background:#1e1e1e; /* dark */
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.back-btn:hover{
    background:#000;
}

/* NEW HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

h2{
    margin:0;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
    <h2>Contact Messages</h2>
    <a href="/admin_dashboard" class="back-btn">Back to Dashboard</a>
</div>

<table>
<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Message</th>
    <th>Action</th>
</tr>

{% for msg in messages %}
<tr>
    <td>{{ msg.id }}</td>
    <td>{{ msg.name }}</td>
    <td>{{ msg.email }}</td>
    <td>{{ msg.message }}</td>
    <td>
        <form action="{{ url_for('delete_message', message_id=msg.id) }}" method="POST" style="display:inline-block;">
            <button type="submit" class="delete-btn" onclick="return confirm('Are you sure you want to delete this message?')">Delete</button>
        </form>
    </td>
</tr>
{% endfor %}

</table>


</div>

</body>
</html>
