<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rate Order</title>

<style>

/* Reset */
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* Dark Background */
body{
    background: linear-gradient(to right, #1e1e2f, #2c2c54);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

/* Glass Container */
.container{
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding:35px;
    border-radius:15px;
    box-shadow:0 15px 35px rgba(0,0,0,0.5);
    width:400px;
}

/* Heading */
h2{
    text-align:center;
    color:#ff7a18;
    margin-bottom:20px;
}

/* Labels */
label{
    display:block;
    margin-top:15px;
    font-weight:500;
    color:#ddd;
}

/* Inputs */
input[type=number], textarea{
    width:100%;
    padding:12px;
    margin-top:5px;
    border-radius:8px;
    border:none;
    background: rgba(255,255,255,0.2);
    color:white;
    font-size:14px;
    transition:0.3s;
}

/* Placeholder */
textarea::placeholder{
    color:#ccc;
}

/* Focus */
input:focus, textarea:focus{
    outline:none;
    box-shadow:0 0 8px rgba(255,122,24,0.5);
}

/* Button */
button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:25px;
    background: linear-gradient(45deg, #ff7a18, #ffb347);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform: scale(1.05);
    opacity:0.9;
}

.nav-buttons{
    margin:20px 0;
    display:flex;
    justify-content:center;
    gap:15px;
}

.nav-buttons a{
    text-decoration:none;
    padding:10px 20px;
    border-radius:25px;
    font-weight:500;
    color:#fff;
    transition:0.3s;
}

/* Home button */
.home-btn{
    background: linear-gradient(45deg, #ff7a18, #ffb347);
}

.home-btn:hover{
    transform: scale(1.05);
    opacity:0.9;
}

</style>

</head>
<body>

<div class="container">
    <h2>Rate: {{ order.menu_name }}</h2>

    <form method="POST">
        <label for="rating">Rating (1-5):</label>
        <input type="number" name="rating" id="rating" min="1" max="5" required>

        <label for="feedback">Feedback:</label>
        <textarea name="feedback" id="feedback" rows="4" placeholder="Write your feedback"></textarea>

        <button type="submit">Submit</button>
        <div class="nav-buttons">
    <a href="{{ url_for('mybookings') }}" class="home-btn">Back to My Orders</a>
</div>
    </form>
</div>

</body>
</html>
