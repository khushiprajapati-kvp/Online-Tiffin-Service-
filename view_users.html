<!DOCTYPE html>
<html>
<head>
<title>View Users</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

.container{
    width:80%;
    margin:40px auto;
    background:#ffffff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

/* NEW: header flex */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

h2{
    color:#333;
    margin:0;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#ff6b00;
    color:white;
    padding:10px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #eee;
    color:#333;
}

/* BACK BUTTON */
.back-btn{
    padding:10px 15px;
    background:#1e1e1e;
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.back-btn:hover{
    background:#000;
}
</style>

</head>

<body>

<div class="container">

<div class="header">
    <h2>User List</h2>
    <a href="/admin_dashboard" class="back-btn">Back to Dashboard</a>
</div>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Email</th>
    <th>Contact</th>
    <th>Address</th>
</tr>

{% for u in users %}

<tr>
    <td>{{ u.id }}</td>
    <td>{{ u.name }}</td>
    <td>{{ u.email }}</td>
    <td>{{ u.contact }}</td>
    <td>{{ u.address }}</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
