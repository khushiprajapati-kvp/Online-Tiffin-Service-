<!DOCTYPE html>
<html>
<head>
<title>View Menu</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

.container{
    width:80%;
    margin:40px auto;
    background:#ffffff;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h2{
    color:#333;
}

/* TABLE */
table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#ff6b00; /* orange */
    color:white;
    padding:10px;
}

td{
    padding:10px;
    text-align:center;
    border-bottom:1px solid #eee;
    color:#333;
}

/* IMAGE */
img{
    width:60px;
    height:60px;
    border-radius:5px;
}

/* TOP BAR */
.top-bar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:15px;
}

/* ADD BUTTON */
.add-btn{
    padding:10px 18px;
    background:#28a745; /* green */
    color:white;
    border-radius:25px;
    text-decoration:none;
}

.add-btn:hover{
    background:#218838;
}

/* EDIT BUTTON */
.edit-btn{
    padding:6px 12px;
    background:#ff6b00; /* orange */
    color:white;
    border-radius:5px;
    text-decoration:none;
}

.edit-btn:hover{
    background:#e65c00;
}

/* DELETE BUTTON (future use) */
.delete-btn{
    padding:6px 12px;
    background:#dc3545;
    color:white;
    border-radius:5px;
    border: none;              /* 👈 ye line add karo */
    outline: none;             /* 👈 extra safety */
    text-decoration:none;
    margin-left:5px;
    cursor: pointer;
    font-size:14px; 
}

/* BACK BUTTON */
.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 15px;
    background:#1e1e1e; /* dark */
    color:white;
    text-decoration:none;
    border-radius:5px;
}

.back-btn:hover{
    background:#000;
}
</style>

</head>

<body>

<div class="container">

<h2>Menu List</h2>

<div class="top-bar">
    <a href="/add_menu" class="add-btn">+ Add Menu</a>
</div>

<table>

<tr>
    <th>ID</th>
    <th>Dish Name</th>
    <th>Description</th>
    <th>Price</th>
    <th>Image</th>
    <th>Action</th>
</tr>

{% for m in menu %}

<tr>
    <td>{{ m.id }}</td>
    <td>{{ m.name }}</td>
    <td>{{ m.description }}</td>
    <td>₹{{ m.price }}</td>
    <td><img src="{{ url_for('static', filename='gallery/' + m.image) }}"></td>
    <td>
        <a href="/edit_menu/{{ m.id }}" class="edit-btn">Edit</a>
        <form action="{{ url_for('delete_menu', id=m.id) }}" method="POST" style="display:inline;" onsubmit="return confirm('Are you sure?')">
            <button type="submit" class="delete-btn">Delete</button>
        </form>
    </td>
</tr>

{% endfor %}

</table>

<a href="/admin_dashboard" class="back-btn">Back to Dashboard</a>

</div>

</body>
</html>
