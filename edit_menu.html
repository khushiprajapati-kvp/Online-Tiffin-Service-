<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Menu Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
body {
    background: #f4f6f9; /* light bg */
}

.container {
    max-width: 600px;
    margin-top: 50px;
    background: #ffffff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

h3{
    color:#333;
}

/* INPUT FOCUS */
.form-control:focus{
    border-color:#ff6b00; /* orange */
    box-shadow:0 0 5px rgba(255,107,0,0.3);
}

/* IMAGE */
img {
    width: 120px;
    margin: 10px 0;
    border-radius: 5px;
}

/* BUTTON */
.btn-primary {
    width: 100%;
    background:#28a745; /* green */
    border:none;
}

.btn-primary:hover{
    background:#218838;
}

/* LINK */
a{
    color:#ff6b00; /* orange */
    text-decoration:none;
}

/* BACK BUTTON */
.back-btn{
    display:inline-block;
    margin-top:20px;
    padding:10px 15px;
    background:#1e1e1e; /* dark like sidebar */
    color:white;
    text-decoration:none;
    border-radius:5px;

}

.back-btn:hover{
    background:#000;
}

</style>
</head>
<body>

<div class="container">
    <h3 class="text-center mb-4">Edit Menu Item ✏️</h3>

    <!-- 🔥 enctype IMPORTANT -->
    <form method="POST" enctype="multipart/form-data">

        <input type="text" name="name" value="{{ menu.name }}" class="form-control mb-2" required>

        <textarea name="description" class="form-control mb-2" placeholder="Dish Description" required>{{ menu.description }}</textarea>

        <input type="number" name="price" value="{{ menu.price }}" class="form-control mb-2" required>

        <!-- Old Image -->
        <label>Current Image:</label><br>
        <img src="{{ url_for('static', filename='gallery/' + menu.image) }}">

        <!-- New Image Upload -->
        <input type="file" name="image" class="form-control mt-2">

        <button type="submit" class="btn btn-primary mt-3">Update Menu</button>

    </form>

    <center><a href="/view_menu" class="back-btn">Back to Menu</a></center>
</div>

</body>
</html>
